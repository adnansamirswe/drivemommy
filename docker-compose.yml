services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drivemommy
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/drivemommy
      APP_PORT: "3000"
      FRONTEND_URL: https://drivemommy.bmgsl.com
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-32-chars-minimum-secret}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      GOOGLE_REDIRECT_URI: https://drivemommy.bmgsl.com/api/connected-accounts/google/callback
    ports:
      - "3000:3000"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: https://drivemommy.bmgsl.com/api
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3000"
    ports:
      - "3001:3000"

volumes:
  pgdata:
